<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街頭異能大亂鬥 - 戰場爆破版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f18;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #181a26;
    }
    canvas {
      background: #12131c;
      border: 3px solid #ff4500;
      box-shadow: 0 0 25px rgba(255, 69, 0, 0.3);
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 15, 24, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .hidden { display: none !important; }
    
    .char-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 20px 0;
      max-width: 780px;
    }
    .char-card {
      background: #222638;
      border: 2px solid #3b4261;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .char-card:hover {
      border-color: #ff4500;
      transform: translateY(-4px);
      background: #2d334d;
    }
    .char-card.selected {
      border-color: #ff4500;
      background: #4a1525;
      box-shadow: 0 0 15px rgba(255, 69, 0, 0.5);
    }
    .char-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      margin: 0 auto 8px auto;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; font-weight: bold;
    }
    .btn {
      background: #ff4500;
      color: #fff; border: none;
      padding: 10px 28px; font-size: 16px;
      border-radius: 6px; cursor: pointer;
      font-weight: bold; transition: 0.2s;
    }
    .btn:hover { background: #ff6347; transform: scale(1.05); }

    #debug-panel {
      width: 310px;
      background: #0d0f18;
      border-left: 2px solid #222638;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #debug-panel h2 { font-size: 15px; color: #ff4500; border-bottom: 1px solid #222638; padding-bottom: 5px; }
    .control-group {
      display: flex; flex-direction: column; gap: 4px;
      background: #181a26; padding: 8px; border-radius: 4px;
    }
    .control-group label { font-size: 12px; color: #a9b1d6; display: flex; justify-content: space-between; }
    
    .hud {
      position: absolute; top: 15px; left: 15px;
      font-size: 13px; background: rgba(13, 15, 24, 0.88);
      padding: 12px 18px; border-radius: 8px; border: 1px solid #ff4500;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 1. 選角選單 UI -->
    <div id="char-select-overlay" class="overlay">
      <h1 style="color: #ff4500; font-size: 28px;">🛢️ 街頭異能大亂鬥 (爆破戰場版)</h1>
      <p style="color: #a9b1d6; margin-top: 5px;">小心油桶與手榴彈！敵我皆可觸發大規模連環爆炸！</p>
      
      <div class="char-grid" id="char-grid"></div>

      <button class="btn" id="start-btn">開始引爆街頭</button>
    </div>

    <!-- 2. Game Over UI -->
    <div id="gameover-overlay" class="overlay hidden">
      <h1 style="color: #ff5370; font-size: 32px;">💥 K.O. 戰鬥結束！</h1>
      <p id="final-stats" style="color: #ccc; margin: 15px 0; font-size: 18px;"></p>
      <div style="display: flex; gap: 10px;">
        <button class="btn" id="restart-btn">重新開始</button>
        <button class="btn" id="reselect-btn" style="background: #222638; color:#fff;">重新選角</button>
      </div>
    </div>

    <!-- 遊戲 HUD -->
    <div class="hud">
      <div>角色: <span id="char-name-val" style="color:#ff4500; font-weight:bold;">-</span> | 持有裝備: <span id="weapon-val" style="color:#ffc777;">空手</span></div>
      <div>HP: <span id="hp-val">100</span> | MP: <span id="en-val">100</span> | 擊殺: <span id="kills-val">0</span></div>
      <div style="color: #ff9e64; font-size: 12px; margin-top: 6px;">
        🎮 [WASD] 移動 | [J] 揮拳 | [K] 防禦 | [L] 撿拾/擲手榴彈<br>
        💣 手榴彈: 按 [L] 拋擲 | 🏏 扔木棒: [按住K] + [L] | 🛢️ 攻擊油桶直接爆炸！
      </div>
    </div>
    
    <canvas id="gameCanvas" width="850" height="550"></canvas>
  </div>

  <!-- 右側控制台 -->
  <div id="debug-panel">
    <h2>⚙️ 爆破戰場控制台</h2>
    <div class="control-group">
      <label>最大同時敵人人數: <span id="v-maxEnemies">2</span></label>
      <input type="range" id="p-maxEnemies" min="1" max="5" step="1" value="2">
    </div>
    <div class="control-group">
      <label>油桶爆破威力: <span id="v-barrelDmg">60</span></label>
      <input type="range" id="p-barrelDmg" min="30" max="120" step="5" value="60">
    </div>
  </div>

  <script>
    const CHARACTERS = [
      { id: 'falco', name: '烈焰法爾', elem: '🔥', color: '#ff5370', hp: 100, en: 100, spd: 4.2, desc: '爆炎氣功波' },
      { id: 'iceberg', name: '霜寒艾斯', elem: '❄️', color: '#89ddff', hp: 110, en: 100, spd: 3.8, desc: '冰刺突襲' },
      { id: 'volt', name: '疾雷伏特', elem: '⚡', color: '#ffc777', hp: 90, en: 120, spd: 5.0, desc: '雷霆衝擊' },
      { id: 'gale', name: '狂風特洛', elem: '🍃', color: '#c3e88d', hp: 95, en: 100, spd: 4.8, desc: '風刃遠程切削' },
      { id: 'golem', name: '磐石高爾', elem: '🪨', color: '#f78c6c', hp: 160, en: 80, spd: 3.0, desc: '重裝霸體坦克' },
      { id: 'lux', name: '聖光路克', elem: '☀️', color: '#ffcb6b', hp: 105, en: 110, spd: 4.0, desc: '聖光懲戒' },
      { id: 'shadow', name: '暗影柴克', elem: '🌑', color: '#bb9af7', hp: 85, en: 130, spd: 5.2, desc: '高爆發暗影刺客' },
      { id: 'venom', name: '毒蛛曼巴', elem: '毒', color: '#9dde55', hp: 100, en: 100, spd: 4.0, desc: '持續毒液噴射' },
      { id: 'magneto', name: '磁力麥格', elem: '🧲', color: '#f07178', hp: 115, en: 90, spd: 3.6, desc: '磁能引力拉拽' },
      { id: 'chronos', name: '時空克洛', elem: '⏱️', color: '#4facfe', hp: 90, en: 140, spd: 4.5, desc: '時空躍遷閃現' }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const config = { maxEnemies: 2, barrelDmg: 60 };

    function setupControls() {
      Object.keys(config).forEach(key => {
        const input = document.getElementById(`p-${key}`);
        const valSpan = document.getElementById(`v-${key}`);
        if(input && valSpan) {
          valSpan.textContent = config[key];
          input.addEventListener('input', (e) => {
            config[key] = parseFloat(e.target.value);
            valSpan.textContent = config[key];
          });
        }
      });
    }

    let selectedCharIndex = 0;
    let gameState = 'MENU';
    let keys = {};
    let kills = 0, lastSpawnTime = 0, shakeTime = 0;
    let lastAttackTime = 0;

    let fighters = [];
    let projectiles = [];
    let mapObjects = []; // 包含 🛢️ 油桶、📦 木箱、💣 落地手榴彈
    let items = [];
    let explosions = []; // 💥 爆炸火焰視覺效果
    let floatingTexts = [];

    // 初始化選角 UI
    const charGrid = document.getElementById('char-grid');
    CHARACTERS.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = `char-card ${idx === 0 ? 'selected' : ''}`;
      card.innerHTML = `
        <div class="char-avatar" style="background:${c.color}; color:#111;">${c.elem}</div>
        <div style="font-weight:bold; font-size:14px; color:#fff;">${c.name}</div>
        <div style="font-size:11px; color:#aaa; margin-top:4px;">${c.desc}</div>
      `;
      card.onclick = () => {
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        card.classList.add('selected');
        selectedCharIndex = idx;
      };
      charGrid.appendChild(card);
    });

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('reselect-btn').onclick = () => {
      document.getElementById('gameover-overlay').classList.add('hidden');
      document.getElementById('char-select-overlay').classList.remove('hidden');
      gameState = 'MENU';
    };

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      handlePlayerSkills(e.key.toLowerCase());
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function triggerShake(dur = 12) { shakeTime = dur; }
    function addFloatingText(text, x, y, color = '#fff') {
      floatingTexts.push({ text, x, y, color, life: 30 });
    }

    // 觸發範圍大爆炸 (油桶/手榴彈)
    function createExplosion(x, y, radius = 70, damage = 60) {
      triggerShake(20);
      explosions.push({ x, y, radius, maxRadius: radius, life: 15 });

      // 對範圍內所有角色造成大傷害與飛踢
      fighters.forEach(f => {
        const d = Math.hypot(f.x - x, f.y - y);
        if (d < radius) {
          const actualDmg = f.isGuarding ? damage * 0.25 : damage;
          f.hp -= actualDmg;
          f.vx = (f.x > x ? 1 : -1) * 12; // 爆飛！
          f.hurtTime = 15;
          addFloatingText(`💥-${Math.ceil(actualDmg)}`, f.x, f.y - 45, "#ff4500");
        }
      });

      // 連鎖引爆附近的油桶或破壞木箱！
      mapObjects.forEach(obj => {
        if (Math.hypot(obj.x - x, obj.y - y) < radius + 15 && !obj.destroyed) {
          obj.hp = 0;
        }
      });
    }

    function startGame() {
      const charData = CHARACTERS[selectedCharIndex];
      fighters = []; projectiles = []; mapObjects = []; items = []; explosions = []; floatingTexts = [];
      kills = 0;

      // 玩家角色
      fighters.push({
        id: 0, isPlayer: true, name: charData.name, charData: charData,
        x: 200, y: 350, vx: 0, speed: charData.spd,
        hp: charData.hp, maxHp: charData.hp, energy: charData.en, maxEnergy: charData.en,
        isFacingLeft: false, isGuarding: false, weapon: null, ammo: 0,
        animFrame: 0, isMoving: false, hurtTime: 0
      });

      // 預先生成 🛢️ 油桶與 📦 木箱
      mapObjects.push({ type: 'BARREL', x: 400, y: 300, hp: 20, maxHp: 20 });
      mapObjects.push({ type: 'BARREL', x: 600, y: 420, hp: 20, maxHp: 20 });
      mapObjects.push({ type: 'CRATE', x: 280, y: 400, hp: 15, maxHp: 15 });

      // 地面預先掉落手榴彈與棒球棍
      items.push({ x: 350, y: 350, type: 'GRENADE', icon: '💣' });
      items.push({ x: 500, y: 280, type: 'BAT', icon: '🏏' });

      document.getElementById('char-name-val').textContent = charData.name;
      document.getElementById('weapon-val').textContent = '空手';
      gameState = 'PLAYING';

      document.getElementById('char-select-overlay').classList.add('hidden');
      document.getElementById('gameover-overlay').classList.add('hidden');
    }

    function handlePlayerSkills(key) {
      if (gameState !== 'PLAYING') return;
      const p = fighters.find(f => f.isPlayer);
      if (!p) return;

      // [L] 鍵：撿拾道具 或 丟出武器/手榴彈
      if (key === 'l') {
        if (p.weapon === 'GRENADE' && p.ammo > 0) {
          // 投擲手榴彈！
          p.ammo--;
          mapObjects.push({
            type: 'THROWN_GRENADE',
            x: p.x + (p.isFacingLeft ? -20 : 20), y: p.y - 15,
            vx: p.isFacingLeft ? -7 : 7, vy: -3, timer: 45
          });
          addFloatingText("投擲手榴彈! 💣", p.x, p.y - 35, "#ff4500");
          if (p.ammo <= 0) { p.weapon = null; document.getElementById('weapon-val').textContent = '空手'; }
        } else if (keys['k'] && p.weapon === 'BAT') {
          // [按住K防禦] + [L] ➔ 把棒球棍當投擲物砸人！
          p.weapon = null;
          document.getElementById('weapon-val').textContent = '空手';
          projectiles.push({
            ownerId: p.id, x: p.x, y: p.y - 15,
            vx: p.isFacingLeft ? -12 : 12, vy: 0,
            color: '#f78c6c', radius: 10, damage: 35, life: 40, isBat: true
          });
          addFloatingText("飛棒打擊! 🏏", p.x, p.y - 35, "#f78c6c");
        } else {
          // 撿拾地面道具
          for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            if (Math.hypot(p.x - item.x, p.y - item.y) < 35) {
              if (item.type === 'GRENADE') {
                p.weapon = 'GRENADE'; p.ammo = 2;
                document.getElementById('weapon-val').textContent = '💣 手榴彈 (2發)';
                addFloatingText("獲得手榴彈! 按L投擲", p.x, p.y - 35, "#ff4500");
              } else if (item.type === 'BAT') {
                p.weapon = 'BAT';
                document.getElementById('weapon-val').textContent = '🏏 棒球棍';
                addFloatingText("裝備: 棒球棍", p.x, p.y - 35, "#ffc777");
              } else if (item.type === 'BEER') {
                p.hp = Math.min(p.maxHp, p.hp + 35);
                addFloatingText("🍺 HP +35", p.x, p.y - 35, "#c3e88d");
              }
              items.splice(i, 1);
              break;
            }
          }
        }
      }

      // 搓招: [按住 K 防禦] + [J 攻擊] ➔ 異能氣功
      if (keys['k'] && key === 'j' && p.energy >= 20) {
        p.energy -= 20;
        triggerShake(8);
        projectiles.push({
          ownerId: p.id, x: p.x + (p.isFacingLeft ? -25 : 25), y: p.y - 18,
          vx: p.isFacingLeft ? -9 : 9, vy: 0,
          color: p.charData.color, radius: 14, damage: 30, life: 60
        });
        addFloatingText(`【${p.charData.name}·異能】`, p.x, p.y - 40, p.charData.color);
      }
    }

    function spawnAIFighter() {
      const activeEnemies = fighters.filter(f => !f.isPlayer).length;
      if (activeEnemies >= config.maxEnemies) return;

      const randomChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      fighters.push({
        id: Date.now() + Math.random(), isPlayer: false,
        name: randomChar.name, charData: randomChar,
        x: Math.random() < 0.5 ? -30 : canvas.width + 30,
        y: Math.random() * (480 - 250) + 250, vx: 0,
        speed: randomChar.spd * 0.85,
        hp: randomChar.hp, maxHp: randomChar.hp, energy: randomChar.en, maxEnergy: randomChar.en,
        isFacingLeft: false, isGuarding: false, weapon: null,
        animFrame: 0, isMoving: false, hurtTime: 0, lastAiAttack: 0
      });
    }

    function update(timestamp) {
      if (gameState !== 'PLAYING') return;

      const player = fighters.find(f => f.isPlayer);

      // 1. 角色移動與打擊處理
      fighters.forEach(f => {
        // 物理擊退位移
        if (Math.abs(f.vx) > 0.1) {
          f.x += f.vx;
          f.vx *= 0.82;
        }

        f.hurtTime = Math.max(0, f.hurtTime - 1);

        if (f.isPlayer) {
          f.isGuarding = keys['k'];
          f.isMoving = false;
          let spd = f.speed;

          if (!f.isGuarding) {
            if (keys['w'] && f.y > 230) { f.y -= spd * 0.7; f.isMoving = true; }
            if (keys['s'] && f.y < 500) { f.y += spd * 0.7; f.isMoving = true; }
            if (keys['a'] && f.x > 20) { f.x -= spd; f.isFacingLeft = true; f.isMoving = true; }
            if (keys['d'] && f.x < canvas.width - 20) { f.x += spd; f.isFacingLeft = false; f.isMoving = true; }
          }

          // [J] 揮拳打擊 (可同時對 敵人、🛢️油桶、📦木箱 造成傷害)
          if (keys['j'] && !keys['k'] && timestamp - lastAttackTime > 220) {
            lastAttackTime = timestamp;
            const range = f.weapon === 'BAT' ? 55 : 35;
            const dmg = f.weapon === 'BAT' ? 28 : 14;

            // 打擊其他角色
            fighters.forEach(target => {
              if (target.id !== f.id && Math.abs(f.y - target.y) < 22 && Math.abs((f.x + (f.isFacingLeft ? -range : range)) - target.x) < range) {
                target.hp -= dmg;
                target.vx = f.isFacingLeft ? -6 : 6;
                target.hurtTime = 10;
                addFloatingText(`-${dmg}`, target.x, target.y - 40, "#ff5370");
              }
            });

            // 打擊地圖油桶或木箱！
            mapObjects.forEach(obj => {
              if (Math.abs(f.y - obj.y) < 25 && Math.abs((f.x + (f.isFacingLeft ? -range : range)) - obj.x) < range) {
                obj.hp -= dmg;
              }
            });
          }

          if (f.energy < f.maxEnergy) f.energy += 0.4;
        } else {
          // AI 敵方打鬥邏輯
          let targets = fighters.filter(o => o.id !== f.id);
          if (targets.length > 0) {
            let target = targets.reduce((p, c) => Math.hypot(f.x - p.x, f.y - p.y) < Math.hypot(f.x - c.x, f.y - c.y) ? p : c);
            f.isFacingLeft = target.x < f.x;
            const dist = Math.hypot(f.x - target.x, f.y - target.y);

            if (dist > 35) {
              f.x += (target.x > f.x ? 1 : -1) * f.speed;
              f.y += (target.y > f.y ? 0.5 : -0.5) * f.speed;
            } else if (timestamp - f.lastAiAttack > 1200) {
              f.lastAiAttack = timestamp;
              target.hp -= 12;
              target.hurtTime = 8;
              addFloatingText("-12", target.x, target.y - 35, "#ccc");
            }
          }
        }
      });

      // 2. 地圖物件 (🛢️ 油桶 / 📦 木箱 / 💣 手榴彈) 邏輯
      for (let i = mapObjects.length - 1; i >= 0; i--) {
        const obj = mapObjects[i];

        // 投擲手榴彈飛行與引爆
        if (obj.type === 'THROWN_GRENADE') {
          obj.x += obj.vx;
          obj.y += obj.vy;
          obj.vy += 0.2; // 重力效果
          obj.timer--;

          if (obj.timer <= 0 || obj.y >= 500) {
            createExplosion(obj.x, obj.y, 75, 50);
            mapObjects.splice(i, 1);
            continue;
          }
        }

        // 油桶/木箱被摧毀毀爛
        if (obj.hp <= 0 && obj.type !== 'THROWN_GRENADE') {
          if (obj.type === 'BARREL') {
            createExplosion(obj.x, obj.y, 85, config.barrelDmg);
          } else if (obj.type === 'CRATE') {
            // 打破木箱必定掉落稀有手榴彈或啤酒
            items.push({ x: obj.x, y: obj.y, type: Math.random() < 0.5 ? 'GRENADE' : 'BEER', icon: Math.random() < 0.5 ? '💣' : '🍺' });
          }
          mapObjects.splice(i, 1);
        }
      }

      // 3. 投射物 / 氣功波碰撞
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.life--;

        // 撞擊角色
        fighters.forEach(f => {
          if (f.id !== p.ownerId && Math.hypot(f.x - p.x, f.y - p.y) < p.radius + 15) {
            f.hp -= p.damage;
            f.vx = p.vx * 0.6;
            f.hurtTime = 10;
            p.life = 0;
            addFloatingText(`-${p.damage}`, f.x, f.y - 40, p.color);
          }
        });

        // 撞擊油桶引爆
        mapObjects.forEach(obj => {
          if (Math.hypot(obj.x - p.x, obj.y - p.y) < p.radius + 20) {
            obj.hp -= p.damage;
            p.life = 0;
          }
        });

        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // 4. 定時召喚敵人與刷出油桶
      if (timestamp - lastSpawnTime > 3500) {
        spawnAIFighter();
        if (mapObjects.filter(o => o.type === 'BARREL').length < 3) {
          mapObjects.push({ type: 'BARREL', x: Math.random() * 600 + 100, y: Math.random() * 200 + 260, hp: 20, maxHp: 20 });
        }
        lastSpawnTime = timestamp;
      }

      // 5. 爆炸視覺特效畫面的衰減
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].life--;
        if (explosions[i].life <= 0) explosions.splice(i, 1);
      }

      // 6. 死亡判定
      for (let i = fighters.length - 1; i >= 0; i--) {
        const f = fighters[i];
        if (f.hp <= 0) {
          if (f.isPlayer) {
            gameState = 'GAMEOVER';
            document.getElementById('final-stats').textContent = `擊殺對手人數: ${kills}`;
            document.getElementById('gameover-overlay').classList.remove('hidden');
          } else {
            kills++;
            fighters.splice(i, 1);
          }
        }
      }

      // 飄浮文字
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].y -= 0.6; floatingTexts[i].life--;
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
      }

      if (player) {
        document.getElementById('hp-val').textContent = Math.ceil(player.hp);
        document.getElementById('en-val').textContent = Math.ceil(player.energy);
        document.getElementById('kills-val').textContent = kills;
      }
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
        shakeTime--;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2.5D 賽道背景
      ctx.fillStyle = '#181a26';
      ctx.fillRect(0, 230, canvas.width, 290);
      ctx.strokeStyle = '#2d334d'; ctx.lineWidth = 2;
      ctx.strokeRect(0, 230, canvas.width, 290);

      if (gameState === 'PLAYING') {
        // 繪製地面道具
        items.forEach(it => {
          ctx.font = '20px sans-serif';
          ctx.fillText(it.icon, it.x - 10, it.y);
        });

        // 繪製地圖爆破物 (🛢️ 油桶 / 📦 木箱 / 💣 投擲中的手榴彈)
        mapObjects.forEach(obj => {
          ctx.font = '24px sans-serif';
          if (obj.type === 'BARREL') ctx.fillText('🛢️', obj.x - 12, obj.y);
          if (obj.type === 'CRATE') ctx.fillText('📦', obj.x - 12, obj.y);
          if (obj.type === 'THROWN_GRENADE') ctx.fillText('💣', obj.x - 10, obj.y);
        });

        // 繪製投射物與飛棒
        projectiles.forEach(p => {
          if (p.isBat) {
            ctx.font = '18px sans-serif';
            ctx.fillText('🏏', p.x - 8, p.y + 6);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
          }
        });

        // 依據 Y 軸深度 (zY) 渲染角色
        fighters.sort((a, b) => a.y - b.y).forEach(f => {
          ctx.save();
          ctx.translate(f.x, f.y);
          if (f.isFacingLeft) ctx.scale(-1, 1);

          // 影子
          ctx.beginPath();
          ctx.ellipse(0, 0, 16, 6, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

          if (f.hurtTime > 0) ctx.filter = 'brightness(2) sepia(1)';

          // 軀幹
          ctx.fillStyle = f.charData.color;
          ctx.fillRect(-8, -28, 16, 15);

          // 頭部
          ctx.beginPath(); ctx.arc(0, -35, 8, 0, Math.PI * 2);
          ctx.fillStyle = '#ffcc80'; ctx.fill();

          // 手部武器
          if (f.weapon === 'BAT') {
            ctx.fillStyle = '#f78c6c'; ctx.fillRect(8, -32, 4, 18);
          } else if (f.weapon === 'GRENADE') {
            ctx.font = '12px sans-serif'; ctx.fillText('💣', 6, -20);
          }

          ctx.restore();

          // 頭頂血條
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(f.x - 20, f.y - 50, 40, 5);
          ctx.fillStyle = f.isPlayer ? '#ff4500' : '#89ddff';
          ctx.fillRect(f.x - 20, f.y - 50, (f.hp / f.maxHp) * 40, 5);
        });

        // 💥 繪製爆炸烈焰特效
        explosions.forEach(ex => {
          ctx.beginPath();
          ctx.arc(ex.x, ex.y, ex.radius * (1 - ex.life / 15), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 69, 0, ${ex.life / 15})`;
          ctx.fill();
        });

        // 飄浮傷害與提示文字
        floatingTexts.forEach(ft => {
          ctx.font = 'bold 13px sans-serif';
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        });
      }

      ctx.restore();
    }

    function gameLoop(timestamp) {
      update(timestamp);
      draw();
      requestAnimationFrame(gameLoop);
    }

    setupControls();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
