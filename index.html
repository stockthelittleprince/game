function pos(a){a.mesh.position.set(a.x,a.y,a.z)}function nearest(a){let best=null,bd=Infinity;for(const t of actors){if(t===a||t.dead)continue;const d=(t.x-a.x)**2+(t.z-a.z)**2;if(d<bd){bd=d;best=t}}return best}

function burst(x,z,y,color,n=25,pow=4){for(let i=0;i<n;i++){const g=new THREE.SphereGeometry(.05+Math.random()*.08,5,5),m=new THREE.MeshBasicMaterial({color,transparent:true});const p=new THREE.Mesh(g,m);p.position.set(x+(Math.random()-.5)*.5,y+(Math.random()-.5)*.3,z+(Math.random()-.5)*.5);p.userData={life:.35+Math.random()*.45,vx:(Math.random()-.5)*pow,vy:Math.random()*pow,vz:(Math.random()-.5)*pow};scene.add(p);effects.push(p)}}

function updateRig(a,dt){const r=a.mesh.userData.rig;const speed=Math.hypot(a.vx,a.vz);const walk=clock.t*(8+speed);const moving=Math.min(1,speed/8);r.legL.rotation.x=Math.sin(walk)*.55*moving;r.legR.rotation.x=-Math.sin(walk)*.55*moving;r.armL.rotation.x=-Math.sin(walk)*.35*moving;r.armR.rotation.x=Math.sin(walk)*.35*moving;r.rig.rotation.y+=((Math.atan2(a.dirX,a.dirZ)-r.rig.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*12);r.torso.rotation.z=Math.sin(clock.t*5)*.025;r.head.rotation.z=Math.sin(clock.t*4.2)*.018;if(a.attackLock>0){r.armR.rotation.x=-1.1;r.armR.rotation.z=.8}else if(!a.guarding){r.armR.rotation.x+=.1}if(a.guarding){r.armL.rotation.x=-1.2;r.armR.rotation.x=-1.2;r.weapon.rotation.y=Math.PI/2}else r.weapon.rotation.y=0;r.aura.intensity=1.1+Math.sin(clock.t*4)*.25}
function update(dt){clock.t+=dt;if(clock.freeze>0){clock.freeze-=dt;return}spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=6+Math.random()*2;spawnEnemy()}for(const a of [...actors]){updateStatuses(a,dt);if(a!==player)ai(a,dt)}playerMove(dt);separate();for(const a of actors){a.y+=a.vy*dt;a.vy-=18*dt;if(a.y<0){a.y=0;a.vy=0}pos(a);updateRig(a,dt)}updateProjectiles(dt);updateAreas(dt);for(let i=clones.length-1;i>=0;i--){const q=clones[i];q.life-=dt;if(q.mesh){q.mesh.position.set(q.x,q.y||0,q.z);q.mesh.userData.rig && (q.mesh.userData.rig.aura.intensity=.25)}if(q.life<=0){scene.remove(q.mesh);clones.splice(i,1)}}for(let i=effects.length-1;i>=0;i--){const e=effects[i],u=e.userData;u.life-=dt;if(u.vx){e.position.x+=u.vx*dt;e.position.z+=u.vz*dt;e.position.y+=u.vy*dt;u.vy-=9*dt}if(e.geometry&&e.geometry.type==='RingGeometry'){const s=1+(1-u.life/.45)*u.scale*1.5;e.scale.setScalar(s);e.material.opacity=Math.max(0,u.life*2)}if(u.life<=0){scene.remove(e);effects.splice(i,1)}}for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;const v=t.a.mesh.position.clone();v.y+=1.5;const s=v.project(camera);t.el.style.left=((s.x*.5+.5)*innerWidth)+'px';t.el.style.top=((-s.y*.5+.5)*innerHeight)+'px';t.el.style.transform='translate(-50%,-50%) translateY('+(-30*(.65-t.life))+'px)';t.el.style.opacity=Math.max(0,t.life/.65);if(t.life<=0){t.el.remove();texts.splice(i,1)}}cameraFollow(dt)}
function cameraFollow(dt){const target=player.mesh.position.clone();target.y=0;const enemy=nearest(player);if(enemy){target.x=(player.x+enemy.x)*.5;target.z=(player.z+enemy.z)*.5}const spread=enemy?Math.hypot(player.x-(enemy?.x||player.x),player.z-(enemy?.z||player.z)):0;const height=15.5+Math.min(8,spread*.28);const back=23+Math.min(10,spread*.32);const desired=new THREE.Vector3(target.x*.42,height,target.z*.42+back);camera.position.lerp(desired,.08);camera.lookAt(target.x,0,target.z);if(clock.shake>.01){camera.position.x+=(Math.random()-.5)*clock.shake;camera.position.y+=(Math.random()-.5)*clock.shake*.6;clock.shake*=.82}}
function render(){renderer.render(scene,camera)}
function ui(){document.getElementById('hp').style.width=player.hp+'%';document.getElementById('mp').style.width=player.mp+'%';document.getElementById('guard').style.width=player.guard+'%';for(let i=0;i<3;i++){const e=document.getElementById('cd'+(i+1));if(player.cd[i]>0){e.style.display='flex';e.textContent=player.cd[i].toFixed(1)}else e.style.display='none'}const alive=actors.filter(a=>a!==player&&!a.dead);document.getElementById('score').textContent=`擊倒 ${score} ｜ 場上 ${alive.length}`;document.getElementById('wave').textContent='WAVE '+wave;document.getElementById('enemyList').innerHTML=alive.map(a=>`<span class="badge">${CHARS[a.kind].name}</span>`).join('')||'<span class="badge">等待挑戰者</span>'}
function switchChar(i){selected=i;const cfg=CHARS[i];document.getElementById('pname').textContent=cfg.name;document.getElementById('ptype').textContent=cfg.type;for(let j=0;j<3;j++){document.getElementById('ic'+(j+1)).textContent=cfg.icons[j];document.getElementById('sk'+(j+1)).textContent=cfg.skills[j]}document.querySelectorAll('.char').forEach((b,j)=>b.classList.toggle('active',i===j));player.mesh.removeFromParent();player.mesh=makeCharacter(i,true);scene.add(player.mesh);pos(player);player.hp=100;player.mp=100;player.guard=100;player.cd=[0,0,0]}
function jump(){if(player.y===0&&!player.dead){player.vy=8.5;burst(player.x,player.z,.1,CHARS[selected].color,15,2)}}function dodge(){if(player.dead||player.stun>0)return;const q=norm((keys.d?1:0)-(keys.a?1:0),(keys.s?1:0)-(keys.w?1:0));const f=(q.x||q.z)?q:{x:player.dirX,z:player.dirZ};player.x=clamp(player.x+f.x*4,-24,24);player.z=clamp(player.z+f.z*4,-21,21);player.inv=.42;burst(player.x,player.z,.5,CHARS[selected].glow,20,3)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','w','a','s','d','j','u','i','o','k','r'].includes(k)||(+k>=1&&+k<=6))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k==='j')melee(player);if(k==='u'||k==='i'||k==='o')skill({u:0,i:1,o:2}[k]);if(k==='w')jump();if(k===' ')dodge();if(k==='k'){player.guarding=true;player.guardT=.18}if(k==='r')location.reload();if(+k>=1&&+k<=6)switchChar(+k-1)});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='k')player.guarding=false});document.querySelectorAll('.char').forEach(b=>b.onclick=()=>switchChar(+b.dataset.i));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();ui();requestAnimationFrame(loop)}
switchChar(0);for(let i=0;i<3;i++)spawnEnemy();requestAnimationFrame(loop);
</script></body></html>
