<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街頭異能大亂鬥 3D - NextGen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    
    /* HUD 介面設計 */
    .hud-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .player-stats {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px 20px; border-radius: 12px;
      width: 320px; backdrop-filter: blur(8px);
    }
    .bar-bg { background: #222; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; transition: width 0.1s ease; }
    .hp-fill { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
    .mp-fill { background: linear-gradient(90deg, #1e3c72, #2a5298); }
    
    .skill-slots {
      display: flex; gap: 12px; margin-top: 10px;
    }
    .skill-box {
      width: 50px; height: 50px; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; color: #fff; position: relative;
    }
    .skill-key { font-weight: bold; color: #ffca28; font-size: 14px; }

    .controls-hint {
      position: absolute; bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; line-height: 1.6;
    }
  </style>
  <!-- 引入 Three.js 3D 渲染引擎 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div class="hud-layer">
      <div class="player-stats">
        <h3 id="char-name" style="color: #fff;">烈焰法爾 (3D 異能型)</h3>
        <div class="bar-bg"><div id="hp-bar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
        <div class="bar-bg"><div id="mp-bar" class="bar-fill mp-fill" style="width: 100%;"></div></div>
        
        <div class="skill-slots">
          <div class="skill-box"><span class="skill-key">U</span><span id="s1-name">爆炎陣</span></div>
          <div class="skill-box"><span class="skill-key">I</span><span id="s2-name">烈焰衝鋒</span></div>
          <div class="skill-box"><span class="skill-key">O</span><span id="s3-name">天劫隕石</span></div>
        </div>
      </div>

      <div class="controls-hint">
        🎮 <b>3D 操作說明</b><br>
        [WASD] 3D 八向移動 | [J] 三連擊攻擊 (Combo)<br>
        [U] 招式一 (近身範圍) | [I] 招式二 (位移突進) | [O] 招式三 (終極大招)<br>
        [K] 防禦閃避
      </div>
    </div>
  </div>

  <script>
    // --- 1. Three.js 3D 基礎場景設置 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 光影配置
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // 3D 擂台地面 (帶有金屬質感與格線)
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1c29, roughness: 0.4, metalness: 0.6 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(60, 30, 0xff4500, 0x333344);
    grid.position.y = 0.01;
    scene.add(grid);

    // --- 2. 3D 角色與動態特效構建 ---
    class Fighter3D {
      constructor(x, z, color, name) {
        this.name = name;
        this.mesh = new THREE.Group();
        
        // 3D 軀幹與關節構建
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.4, 2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.5, roughness: 0.2 });
        this.body = new THREE.Mesh(bodyGeo, bodyMat);
        this.body.position.y = 1.5;
        this.body.castShadow = true;
        this.mesh.add(this.body);

        // 頭部
        const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.8;
        head.castShadow = true;
        this.mesh.add(head);

        // 拳頭 (用於連擊打擊特效)
        const fistGeo = new THREE.SphereGeometry(0.25, 8, 8);
        const fistMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        this.fistR = new THREE.Mesh(fistGeo, fistMat);
        this.fistR.position.set(0.7, 1.5, 0.6);
        this.mesh.add(this.fistR);

        this.mesh.position.set(x, 0, z);
        scene.add(this.mesh);

        // 屬性數值
        this.hp = 100;
        this.mp = 100;
        this.speed = 0.22;
        this.comboStep = 0;
        this.lastAttackTime = 0;
      }

      // 三連擊 (Combo) 系統
      executeCombo() {
        const now = Date.now();
        if (now - this.lastAttackTime > 800) this.comboStep = 0;

        this.comboStep = (this.comboStep % 3) + 1;
        this.lastAttackTime = now;

        // 揮拳出擊動畫 (3D 位移)
        this.fistR.position.z = 1.5;
        setTimeout(() => this.fistR.position.z = 0.6, 150);

        // 產生打擊波光效
        createHitEffect(this.mesh.position, this.comboStep);
      }

      // 招式一：爆炎陣 (範圍柱狀衝爆)
      skill1_ExplosionRing() {
        if (this.mp < 20) return;
        this.mp -= 20;

        const ringGeo = new THREE.CylinderGeometry(4, 4, 0.5, 32, 1, true);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: true, transparent: true, opacity: 1 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(this.mesh.position);
        scene.add(ring);

        // 動態擴張動畫
        let scale = 0.1;
        const interval = setInterval(() => {
          scale += 0.2;
          ring.scale.set(scale, 1, scale);
          ring.material.opacity -= 0.05;
          if (scale >= 2) {
            scene.remove(ring);
            clearInterval(interval);
          }
        }, 16);
      }

      // 招式二：烈焰突進 (前向閃現殘影)
      skill2_Dash() {
        if (this.mp < 25) return;
        this.mp -= 25;

        const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
        this.mesh.position.add(dir.multiplyScalar(6)); // 瞬移向前

        // 留下異能軌跡粒子
        createDashTrail(this.mesh.position);
      }

      // 招式三：天劫隕石 (空間召喚 3D 物體砸下)
      skill3_Meteor() {
        if (this.mp < 50) return;
        this.mp -= 50;

        const meteorGeo = new THREE.DodecahedronGeometry(2, 1);
        const meteorMat = new THREE.MeshStandardMaterial({ color: 0xff1100, emissive: 0xff3300, roughness: 0.8 });
        const meteor = new THREE.Mesh(meteorGeo, meteorMat);
        
        const targetPos = this.mesh.position.clone().add(new THREE.Vector3(0, 0, 8));
        meteor.position.set(targetPos.x, 20, targetPos.z);
        scene.add(meteor);

        // 落下動畫
        const fall = setInterval(() => {
          meteor.position.y -= 0.8;
          meteor.rotation.x += 0.1;
          if (meteor.position.y <= 1) {
            scene.remove(meteor);
            clearInterval(fall);
            createHitEffect(targetPos, 3); // 巨型打擊火花
          }
        }, 16);
      }
    }

    // 打擊 3D 粒子系統
    function createHitEffect(pos, step) {
      const pCount = step * 15;
      const pGeo = new THREE.BufferGeometry();
      const positions = [];
      for (let i = 0; i < pCount; i++) {
        positions.push(
          pos.x + (Math.random() - 0.5) * 2,
          pos.y + 1.5 + (Math.random() - 0.5) * 2,
          pos.z + (Math.random() - 0.5) * 2
        );
      }
      pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const pMat = new THREE.PointsMaterial({ color: step === 3 ? 0xff0000 : 0xffaa00, size: 0.4 });
      const pSystem = new THREE.Points(pGeo, pMat);
      scene.add(pSystem);

      setTimeout(() => scene.remove(pSystem), 300);
    }

    function createDashTrail(pos) {
      const light = new THREE.PointLight(0xff4500, 3, 10);
      light.position.copy(pos);
      scene.add(light);
      setTimeout(() => scene.remove(light), 400);
    }

    // 初始化玩家角色
    const player = new Fighter3D(0, 0, 0xff4500, "烈焰法爾");

    // 控制邏輯
    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;

      if (k === 'j') player.executeCombo();
      if (k === 'u') player.skill1_ExplosionRing();
      if (k === 'i') player.skill2_Dash();
      if (k === 'o') player.skill3_Meteor();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // 遊戲主循環 (Render Loop)
    function animate() {
      requestAnimationFrame(animate);

      // 3D 移動處理
      let moveDir = new THREE.Vector3();
      if (keys['w']) moveDir.z -= 1;
      if (keys['s']) moveDir.z += 1;
      if (keys['a']) moveDir.x -= 1;
      if (keys['d']) moveDir.x += 1;

      if (moveDir.length() > 0) {
        moveDir.normalize();
        player.mesh.position.add(moveDir.multiplyScalar(player.speed));
        
        // 角色轉向移動方向
        const angle = Math.atan2(moveDir.x, moveDir.z);
        player.mesh.rotation.y = angle;
      }

      // 鏡頭跟隨 Player
      camera.position.x = player.mesh.position.x * 0.5;
      camera.position.z = player.mesh.position.z * 0.5 + 28;

      // 更新 HUD
      document.getElementById('hp-bar').style.width = `${player.hp}%`;
      document.getElementById('mp-bar').style.width = `${player.mp}%`;
      if (player.mp < 100) player.mp += 0.1;

      renderer.render(scene, camera);
    }

    animate();

    // 視窗縮放適應
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
