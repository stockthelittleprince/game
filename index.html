<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易筆記與點位追蹤系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0e17;color:#e2e8f0;font-family:Arial,"Microsoft JhengHei",sans-serif}
input,textarea,select,button{font:inherit}
input,textarea,select{color-scheme:dark}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.card{background:#141c2b;border:1px solid #26344b;border-radius:16px;padding:20px;min-width:0}
.field{width:100%;background:#0e1420;border:1px solid #2b3950;border-radius:9px;padding:11px 12px;font-size:14px;color:#e2e8f0}
.field:focus{border-color:#60a5fa;outline:none}
.btn{padding:10px 13px;border-radius:9px;font-size:13px;font-weight:700;transition:.15s}
.btn-blue{background:#2563eb;color:white}.btn-blue:hover{background:#3b82f6}
.btn-gold{background:#f59e0b;color:#111827}.btn-gold:hover{background:#fbbf24}
.btn-gray{background:#202c40;color:#cbd5e1;border:1px solid #334155}
.btn-red{background:#451b29;color:#fda4af;border:1px solid #713044}
.muted{color:#94a3b8}
.label{display:block;font-size:12px;color:#94a3b8;margin-bottom:7px}
.section-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #26344b;font-size:13px;vertical-align:middle}
th{font-size:11px;color:#94a3b8;background:#0e1420;white-space:nowrap}
tr:hover td{background:#172235}
.tag{display:inline-block;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:700}
.empty{text-align:center;color:#64748b;padding:30px 10px;font-size:13px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{width:100%;max-width:440px;background:#141c2b;border:1px solid #334155;border-radius:16px;padding:22px}
#strategyGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.strategy-card{background:#141c2b;border:1px solid #334155;border-radius:14px;padding:16px;min-width:0}
.strategy-card h3{overflow-wrap:anywhere}
#notePanel{border:1px solid #334155;border-radius:14px;background:#111a29;overflow:hidden}
#notePanel summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;font-size:14px;font-weight:800}
#notePanel summary::-webkit-details-marker{display:none}
#notePanel summary:hover{background:#172235}
#notePanel[open] summary{border-bottom:1px solid #26344b}
#notes{display:block;width:100%;min-height:150px;resize:vertical;background:#0e1420;border:1px solid #26344b;border-radius:9px;padding:13px;color:#e2e8f0;font-size:14px;line-height:1.7}
.note-body{padding:15px}
#noteStatus{font-size:11px;color:#94a3b8;font-weight:400}
@media(max-width:900px){#strategyGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
 main{padding:12px!important}
 .card{padding:14px}
 #strategyGrid{grid-template-columns:1fr}
 .header-inner{align-items:flex-start!important;flex-direction:column;padding:14px 0}
 .header-actions{width:100%;display:flex;flex-wrap:wrap}
 .header-actions button{flex:1}
 #notePanel summary{align-items:flex-start}
}
</style>
</head>

      </p>
      <textarea id="notes" placeholder="在這裡記下臨時想法……輸入後會自動儲存。" maxlength="50000"></textarea>
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px">

        <button class="btn btn-gray" type="button" onclick="clearNotes()">清空筆記</button>
