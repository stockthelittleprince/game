<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>街頭異能大亂鬥</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #game-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #1a1a1a; }
    canvas { background: #2b2b2b; border: 3px solid #444; }
    #debug-panel { width: 320px; background: #1f1f24; border-left: 2px solid #333; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    #debug-panel h2 { font-size: 16px; color: #ff5722; border-bottom: 2px solid #ff5722; padding-bottom: 5px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; background: #2a2a32; padding: 8px; border-radius: 4px; }
    .control-group label { font-size: 12px; color: #ddd; display: flex; justify-content: space-between; }
    .hud { position: absolute; top: 15px; left: 15px; font-size: 14px; background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px; border: 1px solid #555; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div>HP: <span id="hp-val">100</span> | EN: <span id="en-val">100</span> | 擊殺: <span id="kills-val">0</span></div>
      <div style="color: #ff9800; font-size: 12px; margin-top: 4px;">🔥 [WASD]移動 | [J]噴火 | [K]火拳 | [L]加速</div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <div id="debug-panel">
    <h2>🔥 異能數據調校</h2>
    <div class="control-group">
      <label>噴火傷害: <span id="v-fireDamage">0.8</span></label>
      <input type="range" id="p-fireDamage" min="0.2" max="5" step="0.1" value="0.8">
    </div>
    <div class="control-group">
      <label>火拳傷害: <span id="v-punchDamage">45</span></label>
      <input type="range" id="p-punchDamage" min="10" max="150" step="5" value="45">
    </div>
    <div class="control-group">
      <label>移動速度: <span id="v-playerSpeed">4.5</span></label>
      <input type="range" id="p-playerSpeed" min="2" max="12" step="0.5" value="4.5">
    </div>
    <div class="control-group">
      <label>怪物生成間隔 (ms): <span id="v-spawnInterval">1500</span></label>
      <input type="range" id="p-spawnInterval" min="300" max="3000" step="100" value="1500">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const config = { fireDamage: 0.8, punchDamage: 45, playerSpeed: 4.5, spawnInterval: 1500 };

    Object.keys(config).forEach(key => {
      const input = document.getElementById(`p-${key}`);
      const valSpan = document.getElementById(`v-${key}`);
      if(input && valSpan) {
        input.addEventListener('input', (e) => {
          config[key] = parseFloat(e.target.value);
          valSpan.textContent = config[key];
        });
      }
    });

    const keys = {};
    let mousePos = { x: 0, y: 0 };
    let kills = 0;
    let lastSpawnTime = 0;

    const player = { x: 400, y: 300, radius: 16, hp: 100, energy: 100, angle: 0 };
    let enemies = [];
    let particles = [];

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    function update(timestamp) {
      player.angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);

      let speed = config.playerSpeed;
      if (keys['l'] && player.energy >= 1) { speed *= 2; player.energy -= 0.5; }

      if ((keys['w'] || keys['arrowup']) && player.y > player.radius) player.y -= speed;
      if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.radius) player.y += speed;
      if ((keys['a'] || keys['arrowleft']) && player.x > player.radius) player.x -= speed;
      if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.radius) player.x += speed;

      if (player.energy < 100) player.energy = Math.min(100, player.energy + 0.3);

      if (keys['j'] && player.energy >= 0.5) {
        player.energy -= 0.5;
        const pAngle = player.angle + (Math.random() - 0.5) * 0.4;
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(pAngle) * 8, vy: Math.sin(pAngle) * 8,
          life: 15, maxLife: 15
        });

        enemies.forEach(e => {
          if (Math.hypot(e.x - player.x, e.y - player.y) < 130) e.hp -= config.fireDamage;
        });
      }

      if (timestamp - lastSpawnTime > config.spawnInterval) {
        enemies.push({
          x: Math.random() < 0.5 ? 0 : canvas.width,
          y: Math.random() * canvas.height,
          hp: 50, maxHp: 50, radius: 14
        });
        lastSpawnTime = timestamp;
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const ang = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(ang) * 2;
        e.y += Math.sin(ang) * 2;

        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) player.hp -= 0.2;
        if (e.hp <= 0) { enemies.splice(i, 1); kills++; }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      document.getElementById('hp-val').textContent = Math.ceil(player.hp);
      document.getElementById('en-val').textContent = Math.ceil(player.energy);
      document.getElementById('kills-val').textContent = kills;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 100, 0, ${p.life / p.maxLife})`;
        ctx.fill();
      });

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.beginPath();
      ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff4500';
      ctx.fill();
      ctx.fillRect(0, -3, 20, 6);
      ctx.restore();

      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#00bfff';
        ctx.fill();
      });
    }

    function loop(timestamp) {
      if (player.hp > 0) {
        update(timestamp);
        draw();
        requestAnimationFrame(loop);
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4500';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
