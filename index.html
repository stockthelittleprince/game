<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>異能亂鬥：覺醒者 Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Segoe UI,Microsoft JhengHei,sans-serif;user-select:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:linear-gradient(135deg,rgba(10,13,22,.94),rgba(17,20,32,.78));border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 0 28px rgba(255,255,255,.025);backdrop-filter:blur(10px);border-radius:16px}.player{position:absolute;left:22px;top:18px;width:430px;padding:15px 17px}.enemy{position:absolute;right:22px;top:18px;width:330px;padding:14px 17px}.title{display:flex;justify-content:space-between;align-items:flex-start}.name{font-size:22px;font-weight:900;letter-spacing:1px}.sub{font-size:11px;color:#9aa1b5;margin-top:2px}.lv{font-size:12px;color:#aeb4c5}.bar{height:12px;background:#111521;border-radius:20px;overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,.06)}.fill{height:100%;transition:width .12s}.hp{background:linear-gradient(90deg,#ff315d,#ff754c);box-shadow:0 0 16px #ff315d66}.mp{background:linear-gradient(90deg,#357bff,#57d5ff);box-shadow:0 0 16px #36a8ff55}.ehp{background:linear-gradient(90deg,#b52cff,#ff3d78);box-shadow:0 0 16px #e32cff55}.skills{display:flex;gap:9px;margin-top:12px}.skill{width:82px;height:70px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.025));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.skill b{position:absolute;left:7px;top:5px;color:#ffd44e;font-size:12px}.skill .ico{font-size:25px;line-height:1}.skill small{font-size:10px;color:#d8dbe4;margin-top:5px}.cd{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;font-size:19px;font-weight:900}.bottom{position:absolute;left:22px;bottom:20px;display:flex;gap:10px;align-items:end}.hint{padding:11px 14px;font-size:11px;line-height:1.65;color:#aeb4c2}.hint b{color:#fff}.chars{display:flex;gap:7px;pointer-events:auto}.char{border:1px solid rgba(255,255,255,.13);background:rgba(8,10,18,.88);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.char.active{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.18)}#message{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.7);font-size:48px;font-weight:1000;letter-spacing:6px;opacity:0;text-shadow:0 0 25px currentColor,0 0 55px currentColor}#message.show{animation:pop .9s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}.tip{position:absolute;right:22px;bottom:20px;padding:10px 13px;color:#8e96aa;font-size:10px}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel player">
    <div class="title"><div><div class="name" id="pname">烈焰法爾</div><div class="sub" id="ptype">覺醒者・炎</div></div><div class="lv">LV.07</div></div>
    <div class="bar"><div class="fill hp" id="hp"></div></div>
    <div class="bar"><div class="fill mp" id="mp"></div></div>
    <div class="skills">
      <div class="skill"><b>J</b><span class="ico">👊</span><small>普通攻擊</small></div>
      <div class="skill"><b>U</b><span class="ico" id="i1">🔥</span><small id="s1">爆炎陣</small><div class="cd" id="c1"></div></div>
      <div class="skill"><b>I</b><span class="ico" id="i2">💨</span><small id="s2">烈焰突進</small><div class="cd" id="c2"></div></div>
      <div class="skill"><b>O</b><span class="ico" id="i3">☄️</span><small id="s3">天劫隕石</small><div class="cd" id="c3"></div></div>
    </div>
  </div>
  <div class="panel enemy"><div class="title"><div><div class="name" style="font-size:18px">虛空獵犬</div><div class="sub">ELITE · Lv.05</div></div><div id="estate" class="lv">戰鬥中</div></div><div class="bar"><div class="fill ehp" id="ehp"></div></div></div>
  <div id="message"></div><div class="flash" id="flash"></div>
  <div class="bottom"><div class="panel hint"><b>WASD</b> 移動　<b>J</b> Combo　<b>U I O</b> 技能　<b>K</b> 防禦　<b>SPACE</b> 閃避　<b>1~4</b> 切換覺醒者</div><div class="chars"><button class="char active" data-i="0">🔥 炎</button><button class="char" data-i="1">❄️ 冰</button><button class="char" data-i="2">⚡ 雷</button><button class="char" data-i="3">🌑 暗</button></div></div>
  <div class="panel tip">自動鎖定附近敵人 · 靠近後可連段</div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2, keys={}; let shake=0,flash=0,last=performance.now(),gameTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const norm=(x,z)=>{let l=Math.hypot(x,z)||1;return{x:x/l,z:z/l}};
const chars=[
 {name:'烈焰法爾',type:'覺醒者・炎',color:'#ff4b1f',glow:'#ff8b28',speed:5.0,skills:['爆炎陣','烈焰突進','天劫隕石'],icons:['🔥','💨','☄️'],cost:[20,25,50],cd:[2.8,3.5,9],desc:'近戰爆發'},
 {name:'冰霜凜',type:'覺醒者・冰',color:'#52ddff',glow:'#b8f7ff',speed:4.2,skills:['冰晶風暴','寒冰之牆','絕對零度'],icons:['❄️','🧊','🌨️'],cost:[20,25,50],cd:[3,5.5,11],desc:'控場減速'},
 {name:'雷迅',type:'覺醒者・雷',color:'#ffd83d',glow:'#fff39b',speed:6.2,skills:['雷爆','閃電連斬','雷神降臨'],icons:['⚡','⚡','🌩️'],cost:[18,25,50],cd:[2.2,4.5,10],desc:'高速連擊'},
 {name:'影刃',type:'覺醒者・暗',color:'#a94dff',glow:'#e1a9ff',speed:5.6,skills:['暗影斬','影分身','虛無領域'],icons:['🌑','👥','🕳️'],cost:[20,25,50],cd:[2.8,5,12],desc:'刺客爆發'}
];
let selected=0;
const player={x:-5,z:4,hp:100,maxHp:100,mp:100,maxMp:100,combo:0,comboT:0,atkT:0,inv:0,stun:0,cd:[0,0,0],facing:{x:1,z:-.1}};
const enemy={x:5,z:-2,hp:220,maxHp:220,stun:0,attackT:0,inv:0,phase:0};
const particles=[],texts=[],zones=[],slashes=[],bolts=[],rocks=[],clones=[];
function c(){return chars[selected]}
function showMessage(t,color){const el=document.getElementById('message');el.textContent=t;el.style.color=color;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function damageText(x,z,n,crit=false,color='#fff'){texts.push({x,z,n,life:.75,vy:2.2,crit,color})}
function burst(x,z,color,n=24,pow=4){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=Math.random()*pow;particles.push({x,z,y:1+Math.random()*1.5,vx:Math.cos(a)*s,vz:Math.sin(a)*s,vy:Math.random()*3+1,life:.45+Math.random()*.55,max:.9,color,size:2+Math.random()*4})}}
function ring(x,z,color,max=5){zones.push({kind:'ring',x,z,r:.4,max,life:.5,maxLife:.5,color})}
function slash(x,z,color,angle){slashes.push({x,z,life:.32,maxLife:.32,color,angle})}
function hitEnemy(dmg,range,knock=0,stun=0){if(enemy.hp<=0)return;if(dist(player,enemy)>range)return;let crit=Math.random()<.12;dmg*=crit?1.65:1;enemy.hp=clamp(enemy.hp-dmg,0,enemy.maxHp);damageText(enemy.x,enemy.z,Math.round(dmg),crit,c().glow);burst(enemy.x,enemy.z,c().color,crit?28:12,crit?6:3);shake=Math.max(shake,crit?.38:.14);enemy.stun=Math.max(enemy.stun,stun);if(knock){const d=norm(enemy.x-player.x,enemy.z-player.z);enemy.x+=d.x*knock;enemy.z+=d.z*knock}if(enemy.hp<=0){enemy.stun=99;document.getElementById('estate').textContent='已擊破';showMessage('MISSION COMPLETE','#fff');burst(enemy.x,enemy.z,'#d34dff',130,9)}}
function hitPlayer(dmg){if(player.inv>0||enemy.hp<=0)return;if(keys.k)dmg*=.28;player.hp=clamp(player.hp-dmg,0,player.maxHp);damageText(player.x,player.z,Math.round(dmg),false,'#ff6075');burst(player.x,player.z,'#ff3d78',14,3);shake=Math.max(shake,.2);flash=.13;if(player.hp<=0){player.hp=100;player.mp=100;player.x=-5;player.z=4;showMessage('RESPAWN','#fff')}}
function skill(i){const cc=c();if(player.stun>0||player.cd[i]>0||player.mp<cc.cost[i])return;player.mp-=cc.cost[i];player.cd[i]=cc.cd[i];const d=norm(player.facing.x,player.facing.z);
 if(selected===0){if(i===0){ring(player.x,player.z,cc.color,5.5);burst(player.x,player.z,'#ff5a18',55,5);hitEnemy(24,5.5,.8,.25)}if(i===1){player.x+=d.x*6;player.z+=d.z*6;burst(player.x,player.z,'#ff6a18',30,5);hitEnemy(30,2.6,1,.25)}if(i===2){rocks.push({x:enemy.x,z:enemy.z,y:15,vy:-18,life:2});showMessage('METEOR','#ff6a2a')}}
 if(selected===1){if(i===0){for(let k=0;k<9;k++){let a=k/9*TAU;bolts.push({x:player.x,z:player.z,vx:Math.cos(a)*8,vz:Math.sin(a)*8,life:1.2,color:'#7eeeff'})}hitEnemy(20,4.8,.2,.2)}if(i===1){zones.push({kind:'wall',x:player.x+d.x*3,z:player.z+d.z*3,r:2.8,life:3,maxLife:3,color:'#55ddff'});burst(player.x+d.x*3,player.z+d.z*3,'#8ff4ff',30,3)}if(i===2){ring(enemy.x,enemy.z,'#8cf6ff',7);enemy.stun=2.2;hitEnemy(52,7,.3,2.2);burst(enemy.x,enemy.z,'#b5fbff',85,7);showMessage('ABSOLUTE ZERO','#8cf6ff')}}
 if(selected===2){if(i===0){bolts.push({x:player.x,z:player.z,vx:d.x*11,vz:d.z*11,life:.7,color:'#ffe84d',pierce:true});hitEnemy(28,4.5,.6,.6)}if(i===1){player.inv=.7;for(let k=0;k<5;k++)setTimeout(()=>{player.x=clamp(player.x+d.x*1.6,-16,16);player.z=clamp(player.z+d.z*1.6,-16,16);slash(player.x,player.z,'#fff06a',Math.atan2(d.x,d.z));hitEnemy(11,2.3,.2,.05)},k*70)}if(i===2){showMessage('THUNDER GOD','#fff06a');for(let k=0;k<9;k++)setTimeout(()=>{let x=enemy.x+(Math.random()-.5)*5,z=enemy.z+(Math.random()-.5)*5;burst(x,z,'#fff06a',20,5);bolts.push({x,z,vx:0,vz:0,life:.25,bolt:true,color:'#fff06a'});hitEnemy(15,3.5,.1,.25)},k*90)}}
 if(selected===3){if(i===0){player.inv=.45;player.x+=d.x*4.5;player.z+=d.z*4.5;slash(player.x,player.z,'#b04cff',Math.atan2(d.x,d.z));hitEnemy(34,2.8,1.2,.35)}if(i===1){for(let k=-1;k<=1;k++)clones.push({x:player.x+k*1.4,z:player.z+1.1,life:1.0,alpha:.55});hitEnemy(30,4.5,.5,.3)}if(i===2){zones.push({kind:'void',x:enemy.x,z:enemy.z,r:6,life:4,maxLife:4,color:'#9e42ff'});enemy.stun=3;hitEnemy(58,6,.3,3);showMessage('VOID DOMAIN','#bd72ff')}}}
function basic(){if(player.stun>0)return;const now=gameTime;if(player.comboT<.65)player.combo=player.combo%3+1;else player.combo=1;player.comboT=0;player.atkT=.22;const d=norm(player.facing.x,player.facing.z);player.x+=d.x*(player.combo===3?.25:.12);player.z+=d.z*(player.combo===3?.25:.12);slash(player.x+d.x*.8,player.z+d.z*.8,c().color,Math.atan2(d.x,d.z));hitEnemy(player.combo===3?15:9,2.6,player.combo===3?1.1:.25,player.combo===3?.28:.08);burst(player.x+d.x,player.z+d.z,c().color,player.combo===3?20:8,player.combo===3?4:2.5)}
function dodge(){if(player.stun>0)return;const d=moveDir();if(!d.x&&!d.z)return;player.inv=.42;player.x+=d.x*3;player.z+=d.z*3;burst(player.x,player.z,c().glow,22,3.5)}
function moveDir(){let x=(keys.d?1:0)-(keys.a?1:0),z=(keys.s?1:0)-(keys.w?1:0);let l=Math.hypot(x,z);return l?{x:x/l,z:z/l}:{x:0,z:0}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;if(k==='j')basic();if(k==='u')skill(0);if(k==='i')skill(1);if(k==='o')skill(2);if(k===' ')dodge();if(k>='1'&&k<='4')switchChar(+k-1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function switchChar(i){if(i===selected)return;selected=i;player.mp=100;player.hp=100;player.cd=[0,0,0];const cc=c();document.getElementById('pname').textContent=cc.name;document.getElementById('ptype').textContent=cc.type;for(let j=0;j<3;j++){document.getElementById('i'+(j+1)).textContent=cc.icons[j];document.getElementById('s'+(j+1)).textContent=cc.skills[j]}document.querySelectorAll('.char').forEach((b,j)=>b.classList.toggle('active',j===i));showMessage(cc.name,cc.color)}document.querySelectorAll('.char').forEach(b=>b.onclick=()=>switchChar(+b.dataset.i));
function ai(dt){if(enemy.hp<=0)return;enemy.stun=Math.max(0,enemy.stun-dt);enemy.inv=Math.max(0,enemy.inv-dt);enemy.attackT-=dt;if(enemy.stun>0)return;let d=norm(player.x-enemy.x,player.z-enemy.z),r=dist(player,enemy);if(r>2.4){enemy.x+=d.x*dt*2.0;enemy.z+=d.z*dt*2.0}else if(enemy.attackT<=0){enemy.attackT=.75;hitPlayer(7+Math.random()*5);slash(player.x,player.z,'#d64cff',Math.atan2(d.x,d.z))}if(r<7&&Math.random()<dt*.16){ring(player.x,player.z,'#d64cff',4);setTimeout(()=>hitPlayer(13),170)}}
function update(dt){gameTime+=dt;const cc=c();player.inv=Math.max(0,player.inv-dt);player.stun=Math.max(0,player.stun-dt);player.comboT+=dt;player.atkT=Math.max(0,player.atkT-dt);player.mp=clamp(player.mp+dt*7,0,100);for(let i=0;i<3;i++)player.cd[i]=Math.max(0,player.cd[i]-dt);if(!keys.k&&player.stun<=0){let d=moveDir();if(d.x||d.z){player.x+=d.x*cc.speed*dt;player.z+=d.z*cc.speed*dt;player.facing=d;}}player.x=clamp(player.x,-16,16);player.z=clamp(player.z,-16,16);ai(dt);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=7*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){let t=texts[i];t.life-=dt;t.z-=t.vy*dt;if(t.life<=0)texts.splice(i,1)}for(let i=zones.length-1;i>=0;i--){let z=zones[i];z.life-=dt;if(z.kind==='void'||z.kind==='wall'){}else z.r+=(z.max-z.r)*dt*9;if(z.kind==='void'&&z.life%0.35<dt)hitEnemy(8,z.r,.05,.05);if(z.life<=0)zones.splice(i,1)}for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1)}for(let i=bolts.length-1;i>=0;i--){let b=bolts[i];b.x+=b.vx*dt;b.z+=b.vz*dt;b.life-=dt;if(!b.bolt&&dist(b,enemy)<1.5){hitEnemy(18,2.0,.2,.1);b.life=0}if(b.life<=0)bolts.splice(i,1)}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.y+=r.vy*dt;r.vy+=7*dt;r.life-=dt;if(r.y<=0){burst(r.x,r.z,'#ff551f',95,8);ring(r.x,r.z,'#ff5b21',7);if(Math.hypot(r.x-enemy.x,r.z-enemy.z)<7)hitEnemy(55,7,1.2,.6);r.life=0}if(r.life<=0)rocks.splice(i,1)}for(let i=clones.length-1;i>=0;i--){clones[i].life-=dt;if(clones[i].life<=0)clones.splice(i,1)}shake*=Math.pow(.001,dt);flash=Math.max(0,flash-dt)}
function project(x,z,y=0){const horizon=H*.42;const scale=28/(z+34);return{x:W/2+x*scale*H/900,y:horizon+(H*.55-y*scale*H/900)*(1-scale*.28)}}
function drawArena(){ctx.fillStyle='#060914';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.45,30,W*.5,H*.48,Math.max(W,H)*.7);g.addColorStop(0,'#20294a');g.addColorStop(.42,'#0d1325');g.addColorStop(1,'#04060c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<18;i++){let z=i*2.2-18;let p1=project(-17,z),p2=project(17,z);ctx.strokeStyle=`rgba(105,125,210,${.05+(18-i)*.003})`;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}for(let x=-16;x<=16;x+=2){let p1=project(x,-18),p2=project(x,18);ctx.strokeStyle='rgba(80,100,180,.07)';ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}const ar=project(0,0);ctx.beginPath();ctx.ellipse(ar.x,ar.y+4,Math.min(W,H)*.22,Math.min(W,H)*.08,0,0,TAU);ctx.fillStyle='rgba(70,100,220,.08)';ctx.fill();ctx.strokeStyle='rgba(105,135,255,.35)';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1}
function drawEffects(){for(const z of zones){const p=project(z.x,z.z,.03);let alpha=clamp(z.life/z.maxLife,0,1);if(z.kind==='ring'||z.kind==='void'){ctx.strokeStyle=z.color;ctx.globalAlpha=alpha*.8;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y+4,z.r*project(1,z.z).x-project(0,z.z).x,z.r*.35,0,0,TAU);ctx.stroke();ctx.globalAlpha=1}if(z.kind==='wall'){const q=project(z.x,z.z,.1);ctx.fillStyle=z.color;ctx.globalAlpha=.28*alpha;ctx.fillRect(q.x-55,q.y-65,110,60);ctx.globalAlpha=1}}for(const b of bolts){const p=project(b.x,b.z,1.2);ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,5,0,TAU);ctx.fill();ctx.shadowBlur=0;if(b.bolt){ctx.strokeStyle=b.color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,p.y-140);ctx.lineTo(p.x+8,p.y-80);ctx.lineTo(p.x-5,p.y-30);ctx.lineTo(p.x,p.y);ctx.stroke()}}for(const r of rocks){const p=project(r.x,r.z,r.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(gameTime*5);ctx.fillStyle='#ff4b20';ctx.shadowColor='#ff4b20';ctx.shadowBlur=28;ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(14,-12);ctx.lineTo(19,12);ctx.lineTo(-12,19);ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0}}
function drawCharacter(o,isPlayer){const cc=isPlayer?c():{color:'#bd37ff',glow:'#f39cff'};const p=project(o.x,o.z,0),s=clamp(1.18*(H/850)*(1+(16-o.z)*.012),.72,1.55);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.globalAlpha=o.hp<=0?.35:1;ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.ellipse(0,7,38,11,0,0,TAU);ctx.fill();if(isPlayer){ctx.shadowColor=cc.glow;ctx.shadowBlur=18}else{ctx.shadowColor='#bd37ff';ctx.shadowBlur=15}/* legs */ctx.shadowBlur=0;ctx.strokeStyle=isPlayer?cc.color:'#7421a5';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-13,-36);ctx.moveTo(10,0);ctx.lineTo(13,-36);ctx.stroke();/* torso */ctx.fillStyle=isPlayer?cc.color:'#7d2aa5';ctx.beginPath();if(selected===1&&isPlayer){ctx.moveTo(-24,-84);ctx.lineTo(24,-84);ctx.lineTo(18,-35);ctx.lineTo(-18,-35)}else if(selected===3&&isPlayer){ctx.moveTo(-29,-40);ctx.lineTo(-18,-90);ctx.lineTo(0,-105);ctx.lineTo(18,-90);ctx.lineTo(29,-40)}else{ctx.roundRect(-20,-91,40,57,10)}ctx.fill();/* arms */ctx.strokeStyle=isPlayer?cc.color:'#8e37b7';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-18,-76);ctx.lineTo(-34,-45);ctx.moveTo(18,-76);ctx.lineTo(34,-45);ctx.stroke();/* head */ctx.fillStyle=isPlayer?'#ffd0b4':'#3d2949';ctx.beginPath();ctx.arc(0,-108,22,0,TAU);ctx.fill();/* face/hair */ctx.fillStyle=isPlayer?(selected===1?'#eafcff':selected===3?'#16121e':'#261821'):'#120b18';ctx.beginPath();ctx.arc(0,-114,23,Math.PI,TAU);ctx.lineTo(18,-108);ctx.lineTo(-18,-108);ctx.closePath();ctx.fill();/* eyes */ctx.fillStyle=cc.glow;ctx.shadowColor=cc.glow;ctx.shadowBlur=10;ctx.fillRect(-11,-108,6,3);ctx.fillRect(5,-108,6,3);ctx.shadowBlur=0;if(selected===0&&isPlayer){ctx.fillStyle='#ff8b24';ctx.beginPath();ctx.moveTo(-11,-126);ctx.lineTo(-2,-151);ctx.lineTo(4,-130);ctx.lineTo(16,-146);ctx.lineTo(12,-118);ctx.closePath();ctx.fill()}if(selected===1&&isPlayer){ctx.fillStyle='#a9f5ff';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*10,-132);ctx.lineTo(i*10+6,-151);ctx.lineTo(i*10+12,-132);ctx.closePath();ctx.fill()}}if(selected===2&&isPlayer){ctx.strokeStyle='#fff09a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-25,-130);ctx.lineTo(-12,-118);ctx.lineTo(-22,-103);ctx.moveTo(25,-130);ctx.lineTo(12,-118);ctx.lineTo(22,-103);ctx.stroke()}if(selected===3&&isPlayer){ctx.fillStyle='#15101e';ctx.beginPath();ctx.moveTo(-25,-100);ctx.lineTo(-18,-145);ctx.lineTo(0,-155);ctx.lineTo(18,-145);ctx.lineTo(25,-100);ctx.closePath();ctx.fill()}if(o.atkT>0){ctx.strokeStyle=cc.glow;ctx.lineWidth=5;ctx.beginPath();ctx.arc(34,-58,35,-1.1,.55);ctx.stroke()}ctx.restore()}
function drawClones(){for(const q of clones){const p=project(q.x,q.z,0);ctx.save();ctx.globalAlpha=q.life*.55;ctx.translate(p.x,p.y);ctx.scale(.9,.9);ctx.fillStyle=c().color;ctx.beginPath();ctx.arc(0,-95,20,0,TAU);ctx.fill();ctx.fillRect(-18,-75,36,48);ctx.restore()}}
function drawParticles(){for(const p of particles){const q=project(p.x,p.z,p.y);ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(q.x,q.y,p.size,0,TAU);ctx.fill();ctx.shadowBlur=0}ctx.globalAlpha=1}
function drawTexts(){for(const t of texts){const p=project(t.x,t.z,1.8);ctx.globalAlpha=clamp(t.life/.75,0,1);ctx.fillStyle=t.color;ctx.font=`900 ${t.crit?22:18}px Segoe UI`;ctx.textAlign='center';ctx.fillText(t.crit?'CRIT '+t.n:t.n,p.x,p.y-(.75-t.life)*55);ctx.textAlign='left'}ctx.globalAlpha=1}
function render(){drawArena();drawEffects();const arr=[{...enemy,_enemy:true},{...player,_player:true}].sort((a,b)=>a.z-b.z);for(const o of arr)drawCharacter(o,!!o._player);drawClones();drawParticles();drawTexts();if(shake>.01){/* screen shake is applied by transform next frame via wrapper */}}
function ui(){document.getElementById('hp').style.width=player.hp+'%';document.getElementById('mp').style.width=player.mp+'%';document.getElementById('ehp').style.width=(enemy.hp/enemy.maxHp*100)+'%';for(let i=0;i<3;i++){const el=document.getElementById('c'+(i+1));if(player.cd[i]>0){el.style.display='flex';el.textContent=player.cd[i].toFixed(1)}else el.style.display='none'}if(flash>0)document.getElementById('flash').style.opacity=String(Math.min(.28,flash*2))}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);ctx.save();if(shake>.01)ctx.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*18);render();ctx.restore();ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);switchChar(0);
</script>
</body>
