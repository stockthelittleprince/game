
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日固定清單</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:30px 15px;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:#0b1120;color:#edf4ff
}
.container{max-width:650px;margin:auto}
h1{font-size:32px;margin-bottom:8px}
.subtitle{color:#9aabc4;line-height:1.7}
.panel{
  margin-top:25px;padding:22px;
  background:#131d30;border:1px solid #293750;
  border-radius:20px
}
.form{display:flex;gap:10px}
input[type=text]{
  flex:1;min-width:0;padding:14px;
  background:#0b1425;border:1px solid #34435c;
  border-radius:10px;color:white;font-size:16px
}
button{
  padding:12px 16px;border:0;border-radius:10px;
  cursor:pointer;font-weight:bold
}
.add{background:#55d6e8;color:#07131c}
.info{
  display:flex;justify-content:space-between;
  gap:10px;margin:24px 0 12px;
  color:#9aabc4;font-size:13px
}
#count{color:#55d6e8}
.track{
  height:6px;background:#26344b;
  border-radius:10px;overflow:hidden;margin-bottom:20px
}
#progress{
  height:100%;width:0%;
  background:linear-gradient(90deg,#55d6e8,#8b9cff);
  transition:width .2s
}
.task{
  display:flex;align-items:center;gap:12px;
  padding:14px;margin-bottom:10px;
  background:#1a2740;border:1px solid #293750;
  border-radius:12px
}
.task input{width:21px;height:21px;accent-color:#55d6e8;flex-shrink:0}
.task-name{flex:1;overflow-wrap:anywhere;line-height:1.5}
.task.done .task-name{color:#8493aa;text-decoration:line-through}
.delete{background:transparent;color:#ff7285}
.empty{
  padding:28px 12px;text-align:center;
  color:#9aabc4;line-height:1.8
}
.bottom{
  display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:12px;
  margin-top:18px;color:#9aabc4;font-size:12px
}
.reset{background:transparent;color:#9aabc4}
.note{
  margin-top:18px;padding:12px;
  background:#102b39;border-radius:10px;
  color:#a8dce5;font-size:12px;line-height:1.8
}
@media(max-width:450px){
  .form{flex-direction:column}
  .add{width:100%}
  .panel{padding:15px}
  h1{font-size:28px}
}
</style>
</head>
<body>
<div class="container">
  <div style="color:#55d6e8;font-size:12px;letter-spacing:3px">
    DAILY CHECKLIST SYSTEM
  </div>
  <h1>每日固定清單</h1>
  <div class="subtitle">
    固定事項永久保留，每天重新勾選即可。
  </div>

  <div class="panel">
    <form id="form" class="form">
      <input id="input" type="text" maxlength="120"
        placeholder="輸入事項，例如：洗衣服、洗碗"
        autocomplete="off">
      <button class="add" type="submit">＋ 新增事項</button>
    </form>

    <div class="info">
      <span id="date"></span>
      <span id="count">0 / 0 完成</span>
    </div>

    <div class="track">
      <div id="progress"></div>
    </div>

    <div id="list"></div>

    <div class="bottom">
      <span>固定事項會一直保留</span>
      <button id="reset" class="reset" type="button">
        取消全部勾選
      </button>
    </div>

    <div class="note">
      每日凌晨 00:00 自動重置勾選狀態，保留所有事項文字。
      資料儲存在目前瀏覽器中。
    </div>
  </div>
</div>

<script>
const KEY = "daily-checklist-v1";
let tasks = [];
let lastDate = getDateKey();

const input = document.getElementById("input");
const form = document.getElementById("form");
const list = document.getElementById("list");

function getDateKey(){
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function save(){
  localStorage.setItem(KEY,JSON.stringify({
    tasks:tasks,
    lastDate:lastDate
  }));
}

function load(){
  try{
    const data = JSON.parse(localStorage.getItem(KEY));
    if(data && Array.isArray(data.tasks)){
      tasks = data.tasks;
      lastDate = data.lastDate || getDateKey();
    }
  }catch(e){
    tasks = [];
  }
  checkNewDay();
  render();
  save();
}

function checkNewDay(){
  const today = getDateKey();
  if(lastDate !== today){
    tasks.forEach(task => task.done = false);
    lastDate = today;
    save();
  }
}

function render(){
  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("zh-TW",{
      year:"numeric",month:"2-digit",day:"2-digit",
      weekday:"short"
    }).format(new Date());

  list.innerHTML = "";

  if(tasks.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "目前沒有事項，請在上方新增固定行程。";
    list.appendChild(empty);
  }

  tasks.forEach(task=>{
    const row = document.createElement("div");
    row.className = "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.setAttribute("aria-label","完成 "+task.text);

    checkbox.addEventListener("change",()=>{
      task.done = checkbox.checked;
      save();
      render();
    });

    const name = document.createElement("span");
    name.className = "task-name";
    name.textContent = task.text;

    const del = document.createElement("button");
    del.className = "delete";
    del.type = "button";
    del.textContent = "刪除";

    del.addEventListener("click",()=>{
      if(confirm("確定刪除「"+task.text+"」？")){
        tasks = tasks.filter(t=>t.id !== task.id);
        save();
        render();
      }
    });

    row.append(checkbox,name,del);
    list.appendChild(row);
  });

  const completed = tasks.filter(t=>t.done).length;
  document.getElementById("count").textContent =
    completed+" / "+tasks.length+" 完成";

  document.getElementById("progress").style.width =
    tasks.length ? (completed/tasks.length*100)+"%" : "0%";
}

form.addEventListener("submit",event=>{
  event.preventDefault();
  const text = input.value.trim();
  if(!text) return;

  tasks.push({
    id:Date.now().toString()+Math.random().toString(16).slice(2),
    text:text,
    done:false
  });

  input.value = "";
  save();
  render();
  input.focus();
});

document.getElementById("reset").addEventListener("click",()=>{
  tasks.forEach(task=>task.done = false);
  save();
  render();
});

// 頁面開啟時定期檢查日期。
// 跨日、電腦睡醒或重新切回頁面時，都會自動重置。
function checkAndRender(){
  const oldDate = lastDate;
  checkNewDay();
  if(oldDate !== lastDate) render();
}

setInterval(checkAndRender,10000);
document.addEventListener("visibilitychange",checkAndRender);
window.addEventListener("focus",checkAndRender);

load();
</script>
</body>
</html>
