<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街頭異能大亂鬥 - LF2 獨立異能者版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1c29;
    }
    canvas {
      background: #12131c;
      border: 3px solid #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 17, 26, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .hidden { display: none !important; }
    
    .char-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 20px 0;
      max-width: 780px;
    }
    .char-card {
      background: #24283b;
      border: 2px solid #414868;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .char-card:hover {
      border-color: #00f2fe;
      transform: translateY(-4px);
      background: #2f354f;
    }
    .char-card.selected {
      border-color: #00f2fe;
      background: #1a3a4b;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .char-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      margin: 0 auto 8px auto;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; font-weight: bold;
    }
    .btn {
      background: #00f2fe;
      color: #0f111a; border: none;
      padding: 10px 28px; font-size: 16px;
      border-radius: 6px; cursor: pointer;
      font-weight: bold; transition: 0.2s;
    }
    .btn:hover { background: #4facfe; transform: scale(1.05); }

    #debug-panel {
      width: 310px;
      background: #0f111a;
      border-left: 2px solid #24283b;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #debug-panel h2 { font-size: 15px; color: #00f2fe; border-bottom: 1px solid #24283b; padding-bottom: 5px; }
    .control-group {
      display: flex; flex-direction: column; gap: 4px;
      background: #1a1c29; padding: 8px; border-radius: 4px;
    }
    .control-group label { font-size: 12px; color: #a9b1d6; display: flex; justify-content: space-between; }
    
    .hud {
      position: absolute; top: 15px; left: 15px;
      font-size: 13px; background: rgba(15, 17, 26, 0.88);
      padding: 12px 18px; border-radius: 8px; border: 1px solid #00f2fe;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 1. 選角選單 UI -->
    <div id="char-select-overlay" class="overlay">
      <h1 style="color: #00f2fe; font-size: 28px;">⚡ 街頭異能大亂鬥 (獨立 AI 大亂鬥)</h1>
      <p style="color: #a9b1d6; margin-top: 5px;">敵人也是擁有獨特招式的異能者，會彼此打鬥與搶拾道具！</p>
      
      <div class="char-grid" id="char-grid"></div>

      <button class="btn" id="start-btn">進入對決</button>
    </div>

    <!-- 2. Game Over UI -->
    <div id="gameover-overlay" class="overlay hidden">
      <h1 style="color: #ff5370; font-size: 32px;">K.O. 戰鬥結束！</h1>
      <p id="final-stats" style="color: #ccc; margin: 15px 0; font-size: 18px;"></p>
      <div style="display: flex; gap: 10px;">
        <button class="btn" id="restart-btn">重新開始</button>
        <button class="btn" id="reselect-btn" style="background: #24283b; color:#fff;">重新選角</button>
      </div>
    </div>

    <!-- 遊戲 HUD -->
    <div class="hud">
      <div>玩家角色: <span id="char-name-val" style="color:#00f2fe; font-weight:bold;">-</span> | 當前持物: <span id="weapon-val" style="color:#ff9e64;">無</span></div>
      <div>HP: <span id="hp-val">100</span> | MP: <span id="en-val">100</span> | 擊殺: <span id="kills-val">0</span></div>
      <div style="color: #bb9af7; font-size: 12px; margin-top: 6px;">
        🎮 [WASD] 走位 | [J] 普通攻擊 | [K] 防禦 | [L] 撿拾道具/武器<br>
        🔥 搓招: [按住K] + [J] (異能氣功) | 敵我皆會互相傷害與搶裝備！
      </div>
    </div>
    
    <canvas id="gameCanvas" width="850" height="550"></canvas>
  </div>

  <!-- 右側控制台 -->
  <div id="debug-panel">
    <h2>⚙️ 遊戲調校控制台</h2>
    <div class="control-group">
      <label>最大同時在場敵人人數: <span id="v-maxEnemies">2</span></label>
      <input type="range" id="p-maxEnemies" min="1" max="5" step="1" value="2">
    </div>
    <div class="control-group">
      <label>敵人 AI 異能攻擊頻率: <span id="v-aiSkillRate">0.5</span></label>
      <input type="range" id="p-aiSkillRate" min="0.1" max="2" step="0.1" value="0.5">
    </div>
    <div class="control-group">
      <label>玩家傷害倍率: <span id="v-dmgMult">1</span></label>
      <input type="range" id="p-dmgMult" min="0.5" max="4" step="0.1" value="1">
    </div>
  </div>

  <script>
    const CHARACTERS = [
      { id: 'falco', name: '烈焰法爾', elem: '🔥', color: '#ff5370', hp: 100, en: 100, spd: 4.2, desc: '火系爆發，爆炎氣功波' },
      { id: 'iceberg', name: '霜寒艾斯', elem: '❄️', color: '#89ddff', hp: 110, en: 100, spd: 3.8, desc: '冰凍控場，冰刺突襲' },
      { id: 'volt', name: '疾雷伏特', elem: '⚡', color: '#ffc777', hp: 90, en: 120, spd: 5.0, desc: '雷霆衝擊，高移動速度' },
      { id: 'gale', name: '狂風特洛', elem: '🍃', color: '#c3e88d', hp: 95, en: 100, spd: 4.8, desc: '風刃遠程切削' },
      { id: 'golem', name: '磐石高爾', elem: '🪨', color: '#f78c6c', hp: 160, en: 80, spd: 3.0, desc: '重裝霸體坦克' },
      { id: 'lux', name: '聖光路克', elem: '☀️', color: '#ffcb6b', hp: 105, en: 110, spd: 4.0, desc: '聖光懲戒與自我治癒' },
      { id: 'shadow', name: '暗影柴克', elem: '🌑', color: '#bb9af7', hp: 85, en: 130, spd: 5.2, desc: '高爆發暗影刺客' },
      { id: 'venom', name: '毒蛛曼巴', elem: '毒', color: '#9dde55', hp: 100, en: 100, spd: 4.0, desc: '持續毒液噴射' },
      { id: 'magneto', name: '磁力麥格', elem: '🧲', color: '#f07178', hp: 115, en: 90, spd: 3.6, desc: '磁能引力拉拽' },
      { id: 'chronos', name: '時空克洛', elem: '⏱️', color: '#4facfe', hp: 90, en: 140, spd: 4.5, desc: '時空躍遷閃現' }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const config = { maxEnemies: 2, aiSkillRate: 0.5, dmgMult: 1 };

    function setupControls() {
      Object.keys(config).forEach(key => {
        const input = document.getElementById(`p-${key}`);
        const valSpan = document.getElementById(`v-${key}`);
        if(input && valSpan) {
          valSpan.textContent = config[key];
          input.addEventListener('input', (e) => {
            config[key] = parseFloat(e.target.value);
            valSpan.textContent = config[key];
          });
        }
      });
    }

    let selectedCharIndex = 0;
    let gameState = 'MENU';
    let keys = {};
    let kills = 0, lastSpawnTime = 0, shakeTime = 0;
    let lastAttackTime = 0;

    let fighters = []; // 包含玩家與所有獨立 AI 異能格鬥家
    let projectiles = [];
    let items = [];
    let floatingTexts = [];

    // 初始化選角介面
    const charGrid = document.getElementById('char-grid');
    CHARACTERS.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = `char-card ${idx === 0 ? 'selected' : ''}`;
      card.innerHTML = `
        <div class="char-avatar" style="background:${c.color}; color:#111;">${c.elem}</div>
        <div style="font-weight:bold; font-size:14px; color:#fff;">${c.name}</div>
        <div style="font-size:11px; color:#aaa; margin-top:4px;">${c.desc}</div>
      `;
      card.onclick = () => {
        document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
        card.classList.add('selected');
        selectedCharIndex = idx;
      };
      charGrid.appendChild(card);
    });

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    document.getElementById('reselect-btn').onclick = () => {
      document.getElementById('gameover-overlay').classList.add('hidden');
      document.getElementById('char-select-overlay').classList.remove('hidden');
      gameState = 'MENU';
    };

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      handlePlayerSkills(e.key.toLowerCase());
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function triggerShake(dur = 8) { shakeTime = dur; }
    function addFloatingText(text, x, y, color = '#fff') {
      floatingTexts.push({ text, x, y, color, life: 30, maxLife: 30 });
    }

    function startGame() {
      const charData = CHARACTERS[selectedCharIndex];
      fighters = [];
      projectiles = [];
      items = [];
      floatingTexts = [];
      kills = 0;

      // 初始化玩家 (id: 0)
      fighters.push({
        id: 0, isPlayer: true,
        name: charData.name, charData: charData,
        x: 200, y: 350, speed: charData.spd,
        hp: charData.hp, maxHp: charData.hp,
        energy: charData.en, maxEnergy: charData.en,
        isFacingLeft: false, isGuarding: false, weapon: null,
        animFrame: 0, isMoving: false, hurtTime: 0
      });

      document.getElementById('char-name-val').textContent = charData.name;
      document.getElementById('weapon-val').textContent = '無';
      gameState = 'PLAYING';

      // 預先刷入隨機戰鬥道具（棒球棍 / 異能晶石 / 啤酒）
      items.push({ x: 300, y: 320, type: 'BAT', icon: '🏏' });
      items.push({ x: 550, y: 380, type: 'CRYSTAL', icon: '💎' });

      document.getElementById('char-select-overlay').classList.add('hidden');
      document.getElementById('gameover-overlay').classList.add('hidden');
    }

    // 玩家技能與撿拾操作
    function handlePlayerSkills(key) {
      if (gameState !== 'PLAYING') return;
      const p = fighters.find(f => f.isPlayer);
      if (!p) return;

      // [L] 撿拾道具 / 武器
      if (key === 'l') {
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          if (Math.hypot(p.x - item.x, p.y - item.y) < 35) {
            if (item.type === 'BAT') {
              p.weapon = 'BAT';
              document.getElementById('weapon-val').textContent = '🏏 棒球棍';
              addFloatingText("裝備: 棒球棍!", p.x, p.y - 35, "#ffc777");
            } else if (item.type === 'CRYSTAL') {
              p.energy = p.maxEnergy;
              addFloatingText("💎 異能全滿!", p.x, p.y - 35, "#00f2fe");
            } else if (item.type === 'BEER') {
              p.hp = Math.min(p.maxHp, p.hp + 35);
              addFloatingText("🍺 HP +35", p.x, p.y - 35, "#c3e88d");
            }
            items.splice(i, 1);
            break;
          }
        }
      }

      // 搓招: [按住 K 防禦] + [J 攻擊] ➔ 異能氣功
      if (keys['k'] && key === 'j' && p.energy >= 20) {
        p.energy -= 20;
        triggerShake(10);
        projectiles.push({
          ownerId: p.id,
          x: p.x + (p.isFacingLeft ? -25 : 25), y: p.y - 18,
          vx: p.isFacingLeft ? -9 : 9, vy: 0,
          color: p.charData.color, radius: 14,
          damage: 30 * config.dmgMult, life: 60
        });
        addFloatingText(`【${p.charData.name}·異能波】`, p.x, p.y - 45, p.charData.color);
      }
    }

    // 生成精緻的獨立 AI 異能格鬥家
    function spawnAIFighter() {
      const activeEnemies = fighters.filter(f => !f.isPlayer).length;
      if (activeEnemies >= config.maxEnemies) return;

      // 隨機抽取 1 位異能角色
      const randomChar = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      const id = Date.now() + Math.random();

      fighters.push({
        id: id, isPlayer: false,
        name: randomChar.name, charData: randomChar,
        x: Math.random() < 0.5 ? -30 : canvas.width + 30, // 從邊緣優雅進場
        y: Math.random() * (480 - 250) + 250,
        speed: randomChar.spd * 0.85,
        hp: randomChar.hp, maxHp: randomChar.hp,
        energy: randomChar.en, maxEnergy: randomChar.en,
        isFacingLeft: false, isGuarding: false, weapon: null,
        animFrame: 0, isMoving: false, hurtTime: 0,
        targetId: null, lastAiAttack: 0
      });

      addFloatingText(`⚠️ 異能者 ${randomChar.name} 登入戰場!`, canvas.width / 2, 230, randomChar.color);
    }

    // 繪製具備動畫細節的 LF2 人形
    function drawDetailedHumanoid(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      if (f.isFacingLeft) ctx.scale(-1, 1);

      // 影子
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();

      // 受擊閃紅效果
      if (f.hurtTime > 0) ctx.filter = 'brightness(1.8) sepia(1) hue-rotate(-50deg)';

      // 腳部走路動畫
      const legOffset = f.isMoving ? Math.sin(f.animFrame * 0.2) * 5 : 0;

      // 雙腿
      ctx.fillStyle = '#1e1e2e';
      ctx.fillRect(-6 + legOffset, -14, 4, 14);
      ctx.fillRect(2 - legOffset, -14, 4, 14);

      // 軀幹 / 外套
      ctx.fillStyle = f.charData.color;
      ctx.fillRect(-8, -28, 16, 15);

      // 頭部
      ctx.beginPath();
      ctx.arc(0, -35, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc80';
      ctx.fill();

      // 頭髮
      ctx.fillStyle = f.charData.color;
      ctx.fillRect(-8, -43, 16, 6);

      // 手部與武器
      ctx.fillStyle = f.charData.color;
      if (f.isGuarding) {
        ctx.fillRect(-4, -28, 8, 8); // 格擋動作
      } else {
        ctx.fillRect(4, -24, legOffset + 6, 6); // 揮臂動作
        if (f.weapon === 'BAT') {
          ctx.fillStyle = '#f78c6c';
          ctx.fillRect(8, -32, 4, 18); // 棍棒
        }
      }

      ctx.restore();

      // 頭頂血條與名稱
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(f.x - 20, f.y - 52, 40, 5);
      ctx.fillStyle = f.isPlayer ? '#00f2fe' : '#ff5370';
      ctx.fillRect(f.x - 20, f.y - 52, (f.hp / f.maxHp) * 40, 5);
      
      ctx.font = '10px sans-serif';
      ctx.fillStyle = '#ccc';
      ctx.textAlign = 'center';
      ctx.fillText(f.name, f.x, f.y - 56);
    }

    function update(timestamp) {
      if (gameState !== 'PLAYING') return;

      const player = fighters.find(f => f.isPlayer);

      // 1. 玩家控制邏輯
      if (player) {
        player.isGuarding = keys['k'];
        player.isMoving = false;
        let spd = player.speed;

        if (!player.isGuarding) {
          if (keys['w'] && player.y > 230) { player.y -= spd * 0.7; player.isMoving = true; }
          if (keys['s'] && player.y < 500) { player.y += spd * 0.7; player.isMoving = true; }
          if (keys['a'] && player.x > 20) { player.x -= spd; player.isFacingLeft = true; player.isMoving = true; }
          if (keys['d'] && player.x < canvas.width - 20) { player.x += spd; player.isFacingLeft = false; player.isMoving = true; }
        }

        if (player.isMoving) player.animFrame++;

        // 普通攻擊 [J]
        if (keys['j'] && !keys['k'] && timestamp - lastAttackTime > 220) {
          lastAttackTime = timestamp;
          const range = player.weapon === 'BAT' ? 55 : 35;
          const baseDmg = player.weapon === 'BAT' ? 28 : 14;

          fighters.forEach(target => {
            if (target.id !== player.id && Math.abs(player.y - target.y) < 22 && Math.abs((player.x + (player.isFacingLeft ? -range : range)) - target.x) < range) {
              const dmg = baseDmg * config.dmgMult;
              target.hp -= dmg;
              target.hurtTime = 10;
              triggerShake(5);
              addFloatingText(`-${Math.ceil(dmg)}`, target.x, target.y - 40, "#ff5370");
            }
          });
        }

        // 自動回復能量
        if (player.energy < player.maxEnergy) player.energy += 0.4;
      }

      // 2. 獨立 AI 異能者邏輯 (獨立尋找目標、互相格鬥、撿拾道具)
      fighters.forEach(f => {
        if (f.isPlayer) return;

        f.hurtTime = Math.max(0, f.hurtTime - 1);
        f.isMoving = false;

        // 尋找最近的攻擊目標（包含玩家或其他 AI 異能者）
        let possibleTargets = fighters.filter(other => other.id !== f.id);
        if (possibleTargets.length === 0) return;

        // 計算距離最短的目標
        let target = possibleTargets.reduce((prev, curr) => 
          Math.hypot(f.x - prev.x, f.y - prev.y) < Math.hypot(f.x - curr.x, f.y - curr.y) ? prev : curr
        );

        // 走位與面向
        f.isFacingLeft = target.x < f.x;
        const dist = Math.hypot(f.x - target.x, f.y - target.y);

        if (dist > 35) {
          f.x += (target.x > f.x ? 1 : -1) * f.speed;
          f.y += (target.y > f.y ? 0.5 : -0.5) * f.speed;
          f.isMoving = true;
          f.animFrame++;
        } else if (timestamp - f.lastAiAttack > 1000 / config.aiSkillRate) {
          // 發動異能或近戰攻擊
          f.lastAiAttack = timestamp;
          
          if (Math.random() < 0.4 && f.energy >= 20) {
            // AI 釋放異能波！
            f.energy -= 20;
            projectiles.push({
              ownerId: f.id,
              x: f.x + (f.isFacingLeft ? -20 : 20), y: f.y - 18,
              vx: f.isFacingLeft ? -8 : 8, vy: 0,
              color: f.charData.color, radius: 12,
              damage: 22, life: 50
            });
            addFloatingText(`【${f.name}·異能!】`, f.x, f.y - 40, f.charData.color);
          } else {
            // 普通攻擊
            target.hp -= 12;
            target.hurtTime = 8;
            addFloatingText(`-12`, target.x, target.y - 35, "#ccc");
          }
        }
      });

      // 3. 定時召喚獨立異能者登場
      if (timestamp - lastSpawnTime > 3500) {
        spawnAIFighter();
        lastSpawnTime = timestamp;
      }

      // 4. 投射物 / 異能波碰撞判定 (支援全體互相傷害)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.life--;

        fighters.forEach(f => {
          if (f.id !== p.ownerId && Math.hypot(f.x - p.x, f.y - p.y) < p.radius + 15) {
            const dmg = f.isGuarding ? p.damage * 0.2 : p.damage;
            f.hp -= dmg;
            f.hurtTime = 12;
            triggerShake(6);
            addFloatingText(`-${Math.ceil(dmg)}`, f.x, f.y - 40, p.color);
            p.life = 0;
          }
        });

        if (p.life <= 0) projectiles.splice(i, 1);
      }

      // 5. 清理死亡角色
      for (let i = fighters.length - 1; i >= 0; i--) {
        const f = fighters[i];
        if (f.hp <= 0) {
          // 死亡掉落道具
          if (Math.random() < 0.6) {
            items.push({ x: f.x, y: f.y, type: 'BEER', icon: '🍺' });
          }
          if (f.isPlayer) {
            gameState = 'GAMEOVER';
            document.getElementById('final-stats').textContent = `總擊殺對手人數: ${kills}`;
            document.getElementById('gameover-overlay').classList.remove('hidden');
          } else {
            kills++;
            fighters.splice(i, 1);
          }
        }
      }

      // 6. 飄浮文字
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.6; ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      if (player) {
        document.getElementById('hp-val').textContent = Math.ceil(player.hp);
        document.getElementById('en-val').textContent = Math.ceil(player.energy);
        document.getElementById('kills-val').textContent = kills;
      }
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        shakeTime--;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 2.5D 賽道背景
      ctx.fillStyle = '#1e202e';
      ctx.fillRect(0, 230, canvas.width, 290);
      ctx.strokeStyle = '#2f354f'; ctx.lineWidth = 2;
      ctx.strokeRect(0, 230, canvas.width, 290);

      if (gameState === 'PLAYING') {
        // 繪製地面道具
        items.forEach(it => {
          ctx.font = '20px sans-serif';
          ctx.fillText(it.icon, it.x - 10, it.y);
        });

        // 繪製異能氣功
        projectiles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });

        // 依據 Y 軸深度 (zY) 進行渲染，確保透視感
        fighters.sort((a, b) => a.y - b.y).forEach(f => {
          drawDetailedHumanoid(f);
        });

        // 漂浮傷害與提示文字
        floatingTexts.forEach(ft => {
          ctx.font = 'bold 13px sans-serif';
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
        });
      }

      ctx.restore();
    }

    function gameLoop(timestamp) {
      update(timestamp);
      draw();
      requestAnimationFrame(gameLoop);
    }

    setupControls();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
